[package]
name = "gurl"
version = "0.2.0"
edition = "2024"
description = "A simple CLI wrapper around curl for easier terminal usage"
license = "MIT"
keywords = ["curl", "http", "cli", "api"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
